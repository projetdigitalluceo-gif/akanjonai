# Static site — no build step, publish the repository root as-is.
[build]
  publish = "."

# Images can be updated under the same filename, so always revalidate
# (ETag-based: fast 304 when unchanged, fresh image when it changes).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
